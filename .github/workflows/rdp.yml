name: RDP

on:
  workflow_dispatch:

concurrency:
  group: rdp-session
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350 # Max limit safety

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          netsh advfirewall firewall add rule name="WebTerminal" dir=in action=allow protocol=TCP localport=7681
          netsh advfirewall firewall add rule name="HermesPort" dir=in action=allow protocol=TCP localport=3000

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $specialChars = [char[]]'!#$%()*+,-./:;=?@[]^_`{|}~'
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = $specialChars
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Deploy Web Terminal & Hermes Agent (Phased Telegram Updates)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          RDP_PASSWORD: ${{ env.RDP_PASSWORD }}
        run: |
          Add-Type -AssemblyName System.Web
          
          $ip = $env:TAILSCALE_IP
          $pass = $env:RDP_PASSWORD
          $safeIp = [System.Net.WebUtility]::HtmlEncode($ip)
          $safePass = [System.Net.WebUtility]::HtmlEncode($pass)
          
          $tzIST = [TimeZoneInfo]::FindSystemTimeZoneById('India Standard Time')
          $istStart = [TimeZoneInfo]::ConvertTime((Get-Date), $tzIST)
          $startTimeStr = $istStart.ToString("yyyy-MM-dd hh:mm:ss tt") + " IST"

          function Invoke-TelegramApi ($method, $payload) {
              $uri = "https://api.telegram.org/bot$($env:BOT_TOKEN)/$method"
              $json = $payload | ConvertTo-Json -Depth 5 -Compress
              return Invoke-RestMethod -Uri $uri -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($json))
          }

          # PHASE 1: IMMEDIATE RDP DETAILS TO TELEGRAM (~5 sec)
          Write-Host "[Phase 1] Sending initial RDP details to Telegram..."
          $termDisplay = "⏳ <i>Starting Web Terminal...</i>"
          $hermesDisplay = "⏳ <i>Waiting for Terminal setup...</i>"
          
          $msgPhase1 = "⚡ <b>Active RDP Details (Auto-Trigger Mode)</b> ⚡`n`n" +
                        "📅 <b>Started At (IST):</b> $startTimeStr`n" +
                        "🌐 <b>Tailscale IP:</b> <code>$safeIp</code>`n" +
                        "👤 <b>Username:</b> <code>RDP</code>`n" +
                        "🔑 <b>Password:</b> <code>$safePass</code>`n`n" +
                        "🖥️ <b>Web Terminal:</b> $termDisplay`n" +
                        "🤖 <b>Hermes Dashboard:</b> $hermesDisplay`n`n" +
                        "⏳ <b>Time Remaining:</b> 05 Hours 35 Mins 00 Secs`n" +
                        "🟢 <b>Status:</b> Active (Initializing Services...)"

          $msgId = $null
          try {
              $chatInfo = Invoke-TelegramApi -method "getChat" -payload @{ chat_id = $env:CHAT_ID }
              if ($chatInfo.ok -and $chatInfo.result.pinned_message) {
                  $msgId = $chatInfo.result.pinned_message.message_id
              }
          } catch {}

          if ($msgId) {
              try {
                  $null = Invoke-TelegramApi -method "editMessageText" -payload @{
                      chat_id    = $env:CHAT_ID
                      message_id = $msgId
                      text       = $msgPhase1
                      parse_mode = "HTML"
                  }
              } catch { $msgId = $null }
          }

          if (-not $msgId) {
              $sendRes = Invoke-TelegramApi -method "sendMessage" -payload @{
                  chat_id    = $env:CHAT_ID
                  text       = $msgPhase1
                  parse_mode = "HTML"
              }
              $msgId = $sendRes.result.message_id
              try {
                  $null = Invoke-TelegramApi -method "pinChatMessage" -payload @{
                      chat_id    = $env:CHAT_ID
                      message_id = $msgId
                  }
              } catch {}
          }

          # PHASE 2: SETUP NATIVE NODE.JS WEB TERMINAL (~15 sec)
          Write-Host "[Phase 2] Setting up Native Node.js Web Terminal..."
          $termDir = "$env:TEMP\webterm"
          New-Item -ItemType Directory -Path $termDir -Force | Out-Null
          Set-Location $termDir

          npm init -y | Out-Null
          npm install ws --quiet

          # Generate index.html cleanly
          $htmlFile = "$termDir\index.html"
          Remove-Item $htmlFile -ErrorAction SilentlyContinue
          Add-Content -Path $htmlFile -Value '<!DOCTYPE html>'
          Add-Content -Path $htmlFile -Value '<html>'
          Add-Content -Path $htmlFile -Value '<head>'
          Add-Content -Path $htmlFile -Value '  <meta charset="utf-8">'
          Add-Content -Path $htmlFile -Value '  <title>Windows Admin Terminal</title>'
          Add-Content -Path $htmlFile -Value '  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />'
          Add-Content -Path $htmlFile -Value '  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>'
          Add-Content -Path $htmlFile -Value '  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>'
          Add-Content -Path $htmlFile -Value '  <style>body,html{margin:0;padding:0;height:100%;background:#0c0c0c;color:#fff;font-family:monospace;overflow:hidden;}#terminal{width:100vw;height:100vh;padding:10px;box-sizing:border-box;}</style>'
          Add-Content -Path $htmlFile -Value '</head>'
          Add-Content -Path $htmlFile -Value '<body>'
          Add-Content -Path $htmlFile -Value '  <div id="terminal"></div>'
          Add-Content -Path $htmlFile -Value '  <script>'
          Add-Content -Path $htmlFile -Value '    const term = new Terminal({cursorBlink:true,theme:{background:"#0c0c0c",foreground:"#00ff00"},fontSize:14});'
          Add-Content -Path $htmlFile -Value '    const fitAddon = new FitAddon.FitAddon();'
          Add-Content -Path $htmlFile -Value '    term.loadAddon(fitAddon);'
          Add-Content -Path $htmlFile -Value '    term.open(document.getElementById("terminal"));'
          Add-Content -Path $htmlFile -Value '    fitAddon.fit();'
          Add-Content -Path $htmlFile -Value '    window.addEventListener("resize",()=>fitAddon.fit());'
          Add-Content -Path $htmlFile -Value '    term.writeln("Connecting to Windows Admin Terminal...");'
          Add-Content -Path $htmlFile -Value '    const protocol = location.protocol === "https:" ? "wss:" : "ws:";'
          Add-Content -Path $htmlFile -Value '    let socket;'
          Add-Content -Path $htmlFile -Value '    function connect(){'
          Add-Content -Path $htmlFile -Value '      socket = new WebSocket(protocol + "//" + location.host + "/ws");'
          Add-Content -Path $htmlFile -Value '      socket.onopen = () => term.writeln("\r\n*** Connected to Windows PowerShell (Admin) ***\r\n");'
          Add-Content -Path $htmlFile -Value '      socket.onmessage = (e) => term.write(e.data);'
          Add-Content -Path $htmlFile -Value '      socket.onclose = () => { term.writeln("\r\n[Disconnected. Reconnecting...]"); setTimeout(connect, 3000); };'
          Add-Content -Path $htmlFile -Value '      socket.onerror = () => socket.close();'
          Add-Content -Path $htmlFile -Value '    }'
          Add-Content -Path $htmlFile -Value '    term.onData(data => { if (socket && socket.readyState === WebSocket.OPEN) socket.send(data); });'
          Add-Content -Path $htmlFile -Value '    connect();'
          Add-Content -Path $htmlFile -Value '  </script>'
          Add-Content -Path $htmlFile -Value '</body>'
          Add-Content -Path $htmlFile -Value '</html>'

          # Generate server.js cleanly
          $srvFile = "$termDir\server.js"
          Remove-Item $srvFile -ErrorAction SilentlyContinue
          Add-Content -Path $srvFile -Value 'const http = require("http");'
          Add-Content -Path $srvFile -Value 'const fs = require("fs");'
          Add-Content -Path $srvFile -Value 'const path = require("path");'
          Add-Content -Path $srvFile -Value 'const { spawn } = require("child_process");'
          Add-Content -Path $srvFile -Value 'const WebSocket = require("ws");'
          Add-Content -Path $srvFile -Value ''
          Add-Content -Path $srvFile -Value 'const server = http.createServer((req, res) => {'
          Add-Content -Path $srvFile -Value '  if (req.url === "/" || req.url === "/index.html") {'
          Add-Content -Path $srvFile -Value '    res.writeHead(200, { "Content-Type": "text/html" });'
          Add-Content -Path $srvFile -Value '    res.end(fs.readFileSync(path.join(__dirname, "index.html")));'
          Add-Content -Path $srvFile -Value '  } else {'
          Add-Content -Path $srvFile -Value '    res.writeHead(404);'
          Add-Content -Path $srvFile -Value '    res.end("Not Found");'
          Add-Content -Path $srvFile -Value '  }'
          Add-Content -Path $srvFile -Value '});'
          Add-Content -Path $srvFile -Value ''
          Add-Content -Path $srvFile -Value 'const wss = new WebSocket.Server({ server, path: "/ws" });'
          Add-Content -Path $srvFile -Value 'wss.on("connection", (ws) => {'
          Add-Content -Path $srvFile -Value '  const ps = spawn("powershell.exe", ["-NoLogo", "-NoExit", "-Command", "-"], { env: process.env, cwd: "C:\\" });'
          Add-Content -Path $srvFile -Value '  ps.stdout.on("data", (d) => ws.readyState === WebSocket.OPEN && ws.send(d.toString().replace(/\n/g, "\r\n")));'
          Add-Content -Path $srvFile -Value '  ps.stderr.on("data", (d) => ws.readyState === WebSocket.OPEN && ws.send(d.toString().replace(/\n/g, "\r\n")));'
          Add-Content -Path $srvFile -Value '  ws.on("message", (m) => ps.stdin.write(m.toString()));'
          Add-Content -Path $srvFile -Value '  ws.on("close", () => { try { ps.kill(); } catch (e) {} });'
          Add-Content -Path $srvFile -Value '  ps.on("close", () => ws.readyState === WebSocket.OPEN && ws.close());'
          Add-Content -Path $srvFile -Value '});'
          Add-Content -Path $srvFile -Value ''
          Add-Content -Path $srvFile -Value 'server.listen(7681, "0.0.0.0", () => console.log("Terminal running on port 7681"));'

          # Start Node Terminal Process
          Start-Process -FilePath "node" -ArgumentList "$termDir\server.js" -WorkingDirectory $termDir -NoNewWindow
          Start-Sleep -Seconds 3

          # Download and Start Cloudflared Tunnel
          $cfPath = "$env:TEMP\cloudflared.exe"
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cfUrl -OutFile $cfPath

          $termLog = "$env:TEMP\cf_terminal.log"
          Start-Process -FilePath $cfPath -ArgumentList "tunnel --url http://127.0.0.1:7681" -RedirectStandardError $termLog -NoNewWindow

          # Cloudflare Tunnel Verification
          $webTermUrl = ""
          $retries = 0
          while (-not $webTermUrl -and $retries -lt 25) {
              Start-Sleep -Seconds 3
              if (Test-Path $termLog) {
                  $logContent = Get-Content $termLog -Raw
                  if ($logContent -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      $candidateUrl = $matches[0]
                      Start-Sleep -Seconds 5
                      $webTermUrl = $candidateUrl
                  }
              }
              $retries++
          }

          if ($webTermUrl) {
              $safeTermUrl = [System.Net.WebUtility]::HtmlEncode($webTermUrl)
              $termDisplay = "🖥️ <a href=`"$safeTermUrl`"><b>Open Web Terminal (Admin)</b></a>"
          } else {
              $termDisplay = "⚠️ <i>Terminal Tunnel Error</i>"
          }

          $hermesDisplay = "⏳ <i>Installing Hermes Gateway Service...</i>"

          $msgPhase2 = "⚡ <b>Active RDP Details (Auto-Trigger Mode)</b> ⚡`n`n" +
                        "📅 <b>Started At (IST):</b> $startTimeStr`n" +
                        "🌐 <b>Tailscale IP:</b> <code>$safeIp</code>`n" +
                        "👤 <b>Username:</b> <code>RDP</code>`n" +
                        "🔑 <b>Password:</b> <code>$safePass</code>`n`n" +
                        "🖥️ <b>Web Terminal:</b> $termDisplay`n" +
                        "🤖 <b>Hermes Dashboard:</b> $hermesDisplay`n`n" +
                        "⏳ <b>Time Remaining:</b> 05 Hours 34 Mins 30 Secs`n" +
                        "🟢 <b>Status:</b> Terminal Ready ✅ (Installing Hermes...)"

          try {
              $null = Invoke-TelegramApi -method "editMessageText" -payload @{
                  chat_id    = $env:CHAT_ID
                  message_id = $msgId
                  text       = $msgPhase2
                  parse_mode = "HTML"
              }
              Write-Host "Telegram updated with Web Terminal link!"
          } catch {}

          # PHASE 3: EXACT HERMES AGENT INSTALLATION & EXECUTION
          Write-Host "[Phase 3] Installing Hermes Agent..."
          $hermesDir = "$env:USERPROFILE\hermes-agent"
          git clone https://github.com/NousResearch/Hermes-Agent.git $hermesDir
          Set-Location $hermesDir

          # 1. Python dependencies install
          if (Test-Path "$hermesDir\requirements.txt") {
              pip install -r requirements.txt --quiet
          }

          # 2. Browser Node dependencies install
          if (Test-Path "$hermesDir\package.json") {
              npm install --quiet
          }

          # 3. Official Execution Command: python run_agent.py
          if (Test-Path "$hermesDir\run_agent.py") {
              Start-Process -FilePath "python.exe" -ArgumentList "run_agent.py" -WorkingDirectory $hermesDir -NoNewWindow
          }

          $hermesPort = 3000
          $hermesLog = "$env:TEMP\cf_hermes.log"
          Start-Process -FilePath $cfPath -ArgumentList "tunnel --url http://127.0.0.1:$hermesPort" -RedirectStandardError $hermesLog -NoNewWindow

          $hermesUrl = ""
          $retries = 0
          while (-not $hermesUrl -and $retries -lt 20) {
              Start-Sleep -Seconds 4
              if (Test-Path $hermesLog) {
                  $logContent = Get-Content $hermesLog -Raw
                  if ($logContent -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                      $hermesUrl = $matches[0]
                  }
              }
              $retries++
          }

          if ($hermesUrl) {
              $safeHermes = [System.Net.WebUtility]::HtmlEncode($hermesUrl)
              $hermesDisplay = "🔗 <a href=`"$safeHermes`"><b>Open Hermes Dashboard</b></a>"
          } else {
              $hermesDisplay = "⚠️ <i>Hermes Agent Started (CLI/Local)</i>"
          }

          # PHASE 4: COUNTDOWN LOOP WITH ALL ACTIVE LINKS
          $totalSeconds = 19800 # 5 hours 30 mins

          for ($s = $totalSeconds; $s -gt 0; $s -= 60) {
              Start-Sleep -Seconds 60
              $remSec = $s - 60
              
              $remHours = [math]::Floor($remSec / 3600)
              $remMin = [math]::Floor(($remSec % 3600) / 60)
              $timeFormatted = "{0:D2} Hours {1:D2} Mins {2:D2} Secs" -f [int]$remHours, [int]$remMin, [int]($remSec % 60)
              
              $istCurrent = [TimeZoneInfo]::ConvertTime((Get-Date), $tzIST).ToString("hh:mm:ss tt") + " IST"
              $statusStr = if ($remSec -gt 0) { "🟢 <b>Status:</b> Active (All Systems Running)" } else { "🔴 <b>Status:</b> Session Ending..." }

              $loopMsg = "⚡ <b>Active RDP Details (Auto-Trigger Mode)</b> ⚡`n`n" +
                         "📅 <b>Started At (IST):</b> $startTimeStr`n" +
                         "🕒 <b>Last Update:</b> $istCurrent`n" +
                         "🌐 <b>Tailscale IP:</b> <code>$safeIp</code>`n" +
                         "👤 <b>Username:</b> <code>RDP</code>`n" +
                         "🔑 <b>Password:</b> <code>$safePass</code>`n`n" +
                         "🖥️ <b>Web Terminal:</b> $termDisplay`n" +
                         "🤖 <b>Hermes Dashboard:</b> $hermesDisplay`n`n" +
                         "⏳ <b>Time Remaining:</b> $timeFormatted`n" +
                         $statusStr

              try {
                  $null = Invoke-TelegramApi -method "editMessageText" -payload @{
                      chat_id    = $env:CHAT_ID
                      message_id = $msgId
                      text       = $loopMsg
                      parse_mode = "HTML"
                  }
              } catch {}
          }

      - name: Auto Trigger Next Workflow (Instant Run)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rdp.yml -R $env:GITHUB_REPOSITORY
